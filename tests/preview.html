<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messenger UI preview</title><link rel="stylesheet" href="../assets/messenger.css"><style>body{max-width:1180px;margin:2rem auto;padding:0 1rem;background:#f4f5f7;font-family:Inter,system-ui,sans-serif}</style></head><body>
<section class="MessengerApp"><header class="MessengerApp-header"><h1>Messages</h1><button>New message</button></header><div class="MessengerApp-layout">
<aside class="MessengerInbox"><nav><button aria-current="page">Inbox</button><button>Requests</button><button>Archived</button></nav><form class="MessengerSearch"><input type="search" placeholder="Search messages"><button>⌕</button></form>
<button class="MessengerConversation" data-active="true"><span class="MessengerAvatar">A</span><span class="MessengerConversation-body"><span class="MessengerConversation-top"><strong>Alex Morgan</strong><time>10:42 AM</time></span><span class="MessengerConversation-bottom"><span class="MessengerConversation-preview">That sounds perfect. See you tomorrow!</span><span class="MessengerUnread">2</span></span></span></button>
<button class="MessengerConversation"><span class="MessengerAvatar">S</span><span class="MessengerConversation-body"><span class="MessengerConversation-top"><strong>Sam Lee</strong><time>Yesterday</time></span><span class="MessengerConversation-bottom"><span class="MessengerConversation-preview">Message request</span></span></span></button></aside>
<main class="MessengerThread"><header class="MessengerThread-header"><div class="MessengerIdentity"><button class="MessengerBack">Back</button><span class="MessengerAvatar">A</span><h2>Alex Morgan</h2></div><div class="MessengerThread-actions"><button>Archive</button><button>Mute</button><button class="MessengerDanger">Block</button></div></header><div class="MessengerMessages">
<article class="MessengerMessage is-other"><div class="MessengerBubble"><p>Hello! I saw your profile and wanted to say hi.</p><time>10:38 AM</time><span class="MessengerMessage-controls"><button class="MessengerMessage-action">Report</button><button class="MessengerMessage-action">Hide</button></span></div></article>
<article class="MessengerMessage is-own"><div class="MessengerBubble"><p>Hi Alex — nice to meet you. Tomorrow works for me.</p><time>10:40 AM</time><span class="MessengerMessage-controls"><button class="MessengerMessage-action">Edit</button><button class="MessengerMessage-action">Delete</button></span></div></article>
<article class="MessengerMessage is-other"><div class="MessengerBubble"><p>That sounds perfect. See you tomorrow!</p><time>10:42 AM</time></div></article></div><form class="MessengerComposer"><textarea rows="1" placeholder="Write a message…"></textarea><button class="MessengerPrimary">Send</button></form></main>
</div></section></body></html>
